<!doctype html>
<html lang="en">
<head>
	{% load static %}
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Stash{% endblock %}</title>
	<link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.png' %}" >
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://kit.fontawesome.com/c45f8edf9d.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
	<link rel="stylesheet" href="{% static 'stash/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100" data-bs-theme="dark">
	<nav class="navbar navbar-expand-sm border-bottom">
		<div class="container-fluid">
			{% load socialaccount %}
			<ul class="navbar-nav flex-row gap-sm-0 gap-3 me-auto">
				<li class="nav-item">
					<a class="nav-link {% block stash_active %}active{% endblock %}" href="{% url 'file_list' %}">Stash</a>
				</li>
				<li class="nav-item">
					{% if user.is_authenticated %}
						<a class="nav-link {% block upload_active %}{% endblock %}" href="{% url 'file_upload' %}">Upload</a>
					{% else %}
						<a class="nav-link disabled">Upload</a>
					{% endif %}
				</li>
			</ul>
			{% if user.is_authenticated %}
				<a href="/stash/profile/">
					<img src="{{ user.socialaccount_set.all.0.get_avatar_url }}" class="rounded-circle" height="40">
				</a>
				<form action="{% url 'account_logout' %}" method="post">
					{% csrf_token %}
					<button type="submit" class="btn btn-outline-light ms-3">Logout</button>
				</form>
			{% else %}
				<form action="{% provider_login_url 'discord' %}" method="post">
					{% csrf_token %}
					<button type="submit" class="btn btn-discord">Login with Discord</button>
				</form>
			{% endif %}
		</div>
	</nav>
	
	<div class="container-xxl flex-grow-1 p-3 bg-secondary-subtle">
		{% block content %}
		{% endblock %}
	</div>
</body>
</html>
